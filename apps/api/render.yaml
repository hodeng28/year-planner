databases:
  - name: trading-journal-db
    plan: free
    databaseName: trading_journal
    user: trading_user

services:
  - type: web
    name: trading-journal-api
    plan: free
    runtime: node
    buildCommand: cd ../.. && pnpm install && pnpm --filter api build
    startCommand: cd ../.. && pnpm --filter api start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-journal-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: trading-journal-db
          property: connectionString
      - key: NODE_ENV
        value: production
